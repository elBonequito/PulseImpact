<!doctype html><html lang="pt-BR"><meta charset="utf-8"><base href="../"><title>Pulse Impact — mortes</title><style>body{margin:24px;background:#17111a;color:#e4d4aa;font:16px system-ui}button,select,a{background:#29202a;color:inherit;padding:10px;border:1px solid #947d53;margin:4px}canvas{display:block;width:min(960px,100%);height:auto;image-rendering:pixelated;border:1px solid #685640;margin-top:16px}p{max-width:800px}</style><h1>Pulse Impact — animações de morte</h1><p>Escolha a causa e reproduza uma sequência de dois segundos. A escala 1× usa o tamanho real da nave em partida. Esta página exibe os sprites isolados.</p><select id="kind"><option value="tiro">Projétil inimigo</option><option value="asteroide">Asteroide</option><option value="raio_serafim">Raio do Serafim</option><option value="penas_serafim">Penas do Serafim</option><option value="colisao">Colisão com nave / Centopeia</option></select><select id="scale"><option value="1">Tamanho real · 1×</option><option value="4">Ampliado · 4×</option></select><button id="play">Reproduzir</button><a href="index.html">Abrir jogo</a><canvas id="preview" width="1920" height="960"></canvas><script src="scripts/player/death.js"></script><script>
const g=document.getElementById('preview').getContext('2d');
const shipArt=new Image();shipArt.src='art/player/ship.webp';
const loadedArt=image=>image.complete&&image.naturalWidth>0;
const kind=document.getElementById('kind'),scale=document.getElementById('scale');
let beginning=0;
function play(){death={kind:kind.value,age:0,frame:0,x:0,y:0,tilt:0};beginning=performance.now()}
function render(now){g.setTransform(2,0,0,2,0,0);g.fillStyle='#17111a';g.fillRect(0,0,960,480);g.fillStyle='#7f7889';for(let i=0;i<70;i++)g.fillRect(i*137%960,i*89%480,1,1);if(death){death.age=Math.min(2,(now-beginning)/1000);death.frame=Math.min(47,Math.floor(death.age*24));g.save();g.translate(480,240);g.scale(Number(scale.value),Number(scale.value));drawDeath();g.restore()}requestAnimationFrame(render)}
document.getElementById('play').onclick=kind.onchange=play;
Promise.all([...Object.values(deathArt),shipArt].map(image=>image.decode())).then(play).catch(()=>{});
requestAnimationFrame(render);
</script></html>
